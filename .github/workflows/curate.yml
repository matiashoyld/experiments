name: twitter-curation

on:
  schedule:
    # After Reader's AM/PM digests (UTC). Multiple catch-up slots per window because
    # GitHub delays scheduled jobs 30-90min; extra runs are no-ops (digest already processed).
    # AM window (~05:00-06:00 UTC digest): 05:30, 07:00, 08:30
    # PM window (~16:00-17:00 UTC digest): 16:30, 18:00, 19:30
    - cron: "30 5,7,8,16,18,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to Readwise)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: twitter-curation
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r twitter-curation/requirements.txt

      - name: Curate
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python twitter-curation/curate.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        run: |
          [ -d twitter-curation/data ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add twitter-curation/data/
          git diff --cached --quiet && exit 0
          git commit -m "twitter-curation: update seen state [skip ci]"
          git push

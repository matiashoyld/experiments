# Twitter → Readwise Reader curation pipeline
# See CLAUDE.md for how this works.

# The X List digest to process (matched against doc source_url)
list_url_match: "i/lists/2063490581108830659"

# How many items survive each run (cron runs 2x/day -> ~2x this per day)
keep_count: 5          # hard cap per run
min_score: 6           # don't keep anything below this even if under cap

# Prefilter: entries shorter than this (and not threads/link-tweets) are dropped unscored
min_word_count: 100

# How far back to look for digest docs (hours). Processed-digest state dedupes overlap.
lookback_hours: 26

# Archive the digest doc after processing (so the firehose never hits the eyes)
archive_digest: true

# Tags applied to keepers. 'shortlist' feeds Reader's built-in Shortlist view.
keeper_tags:
  - shortlist
  - curated

# Topic tags the scorer can assign (one per item)
topics:
  - ai-engineering
  - frontier-ai
  - ai-essays
  - rationality
  - agency
  - contemplative
  - tools-for-thought
  - parenting-education
  - econ-progress
  - builders-craft
  - spanish-ai

# Gemini model for scoring. thinking_level: high = max reasoning (Matias's choice 2026-06-06)
model: gemini-3.1-pro-preview
thinking_level: high
